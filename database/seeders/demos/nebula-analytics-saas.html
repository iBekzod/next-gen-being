<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nebula — Revenue Analytics</title>
<style>
  :root{
    --bg: oklch(0.17 0.021 275); --panel: oklch(0.205 0.026 275); --panel-2: oklch(0.235 0.03 275);
    --line: oklch(0.31 0.03 275); --fg: oklch(0.97 0.008 275); --muted: oklch(0.68 0.022 275);
    --accent: oklch(0.72 0.15 285); --accent-2: oklch(0.80 0.12 205);
    --good: oklch(0.74 0.16 155); --bad: oklch(0.68 0.19 22);
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --num: "SF Mono", "Cascadia Code", ui-monospace, monospace;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--font); background:var(--bg); color:var(--fg);
    -webkit-font-smoothing:antialiased; height:100vh; display:flex; overflow:hidden; }
  .tnum{ font-variant-numeric: tabular-nums; }

  /* sidebar */
  .side{ width:230px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line);
    padding:22px 16px; display:flex; flex-direction:column; gap:4px; }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.15rem; letter-spacing:-.02em; margin:0 6px 22px; }
  .brand .orb{ width:24px; height:24px; border-radius:8px;
    background:conic-gradient(from 210deg, var(--accent), var(--accent-2), var(--accent)); box-shadow:0 0 18px oklch(0.72 0.15 285 / .5); }
  .navi{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:var(--muted);
    font-weight:500; font-size:.9rem; cursor:pointer; transition:.15s; }
  .navi:hover{ color:var(--fg); background:var(--panel-2); }
  .navi.on{ color:var(--fg); background:linear-gradient(90deg, oklch(0.72 0.15 285 / .18), transparent); box-shadow:inset 2px 0 0 var(--accent); }
  .navi .i{ width:17px; height:17px; opacity:.9; }
  .side .sp{ flex:1; }
  .plan{ border:1px solid var(--line); border-radius:12px; padding:13px; background:var(--panel-2); }
  .plan b{ font-size:.85rem; } .plan p{ margin:4px 0 10px; font-size:.75rem; color:var(--muted); }
  .plan .bar{ height:6px; border-radius:99px; background:var(--line); overflow:hidden; }
  .plan .bar i{ display:block; height:100%; width:72%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); }

  /* main */
  .main{ flex:1; overflow:auto; padding:22px 26px 40px; }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .top h1{ margin:0; font-size:1.5rem; font-weight:800; letter-spacing:-.03em; }
  .top .sub{ color:var(--muted); font-size:.85rem; margin-top:3px; }
  .controls{ display:flex; align-items:center; gap:12px; }
  .seg{ display:flex; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:3px; }
  .seg button{ border:none; background:transparent; color:var(--muted); font-family:inherit; font-weight:600; font-size:.8rem;
    padding:7px 13px; border-radius:7px; cursor:pointer; transition:.15s; }
  .seg button.on{ background:var(--panel-2); color:var(--fg); box-shadow:0 1px 3px oklch(0 0 0 / .3); }
  .av{ width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-2)); }

  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px; }
  @media(max-width:820px){ .kpis{ grid-template-columns:repeat(2,1fr);} }
  .kpi{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:15px 16px; }
  .kpi .lbl{ font-size:.76rem; color:var(--muted); font-weight:500; }
  .kpi .val{ font-family:var(--num); font-size:1.55rem; font-weight:700; letter-spacing:-.02em; margin:6px 0 4px; }
  .kpi .row{ display:flex; align-items:center; justify-content:space-between; }
  .delta{ font-size:.74rem; font-weight:700; padding:2px 7px; border-radius:99px; }
  .delta.up{ color:var(--good); background:oklch(0.74 0.16 155 / .14); }
  .delta.dn{ color:var(--bad); background:oklch(0.68 0.19 22 / .14); }
  .spark{ width:64px; height:26px; }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 20px; }
  .grid2{ display:grid; grid-template-columns:1.7fr 1fr; gap:16px; margin-bottom:16px; }
  @media(max-width:900px){ .grid2{ grid-template-columns:1fr; } }
  .ch-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
  .ch-head .big{ font-family:var(--num); font-size:1.7rem; font-weight:700; letter-spacing:-.02em; }
  .ch-head .cap{ font-size:.8rem; color:var(--muted); }
  .chart-wrap{ position:relative; }
  #chart{ width:100%; height:210px; display:block; }
  .tip{ position:absolute; pointer-events:none; background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    padding:7px 10px; font-size:.76rem; opacity:0; transform:translate(-50%,-115%); transition:opacity .12s; white-space:nowrap; box-shadow:0 8px 24px oklch(0 0 0 / .4); }
  .tip b{ font-family:var(--num); }

  .donut-wrap{ display:flex; align-items:center; gap:18px; }
  .legend{ display:flex; flex-direction:column; gap:9px; font-size:.82rem; }
  .legend .lg{ display:flex; align-items:center; gap:8px; color:var(--muted); }
  .legend .lg .dot{ width:9px; height:9px; border-radius:3px; }
  .legend .lg b{ color:var(--fg); font-family:var(--num); margin-left:auto; }

  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; padding:0 0 10px; }
  td{ padding:11px 0; border-top:1px solid var(--line); font-size:.88rem; }
  .prod{ display:flex; align-items:center; gap:10px; font-weight:600; }
  .prod .ic{ width:28px; height:28px; border-radius:8px; display:grid; place-items:center; font-size:.8rem; font-weight:800; color:#0b0f1c; }
  .mbar{ height:7px; border-radius:99px; background:var(--line); overflow:hidden; min-width:80px; }
  .mbar i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
  .live{ display:inline-flex; align-items:center; gap:7px; font-size:.76rem; color:var(--good); font-weight:600; }
  .live .p{ width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 0 0 oklch(0.74 0.16 155 / .6); animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 oklch(0.74 0.16 155 / .5)} 70%{box-shadow:0 0 0 8px oklch(0.74 0.16 155 / 0)} 100%{box-shadow:0 0 0 0 oklch(0.74 0.16 155 / 0)} }
</style>
</head>
<body>
  <aside class="side">
    <div class="brand"><span class="orb"></span> Nebula</div>
    <div class="navi on"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 8h8V3h-8z"/></svg> Overview</div>
    <div class="navi"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg> Revenue</div>
    <div class="navi"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="3"/><path d="M2 21a7 7 0 0114 0"/><path d="M17 11l2 2 4-4"/></svg> Customers</div>
    <div class="navi"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg> Subscriptions</div>
    <div class="navi"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 00-1.7-1l-.3-2.5h-4l-.3 2.5a7 7 0 00-1.7 1l-2.3-1-2 3.4L4.1 11a7 7 0 000 2l-2 1.5 2 3.4 2.3-1a7 7 0 001.7 1l.3 2.5h4l.3-2.5a7 7 0 001.7-1l2.3 1 2-3.4-2-1.5a7 7 0 00.1-1z"/></svg> Settings</div>
    <div class="sp"></div>
    <div class="plan"><b>Growth plan</b><p>72% of monthly events used</p><div class="bar"><i></i></div></div>
  </aside>

  <main class="main">
    <div class="top">
      <div>
        <h1>Revenue overview</h1>
        <div class="sub">Welcome back — here's how things are trending.</div>
      </div>
      <div class="controls">
        <div class="seg" id="seg">
          <button data-r="7">7D</button>
          <button data-r="30" class="on">30D</button>
          <button data-r="90">90D</button>
          <button data-r="365">12M</button>
        </div>
        <div class="av"></div>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="grid2">
      <div class="panel">
        <div class="ch-head">
          <div>
            <div class="cap">Monthly recurring revenue</div>
            <div class="big tnum" id="mrrBig">$0</div>
          </div>
          <span class="live"><span class="p"></span><span id="activeNow">0</span> active now</span>
        </div>
        <div class="chart-wrap">
          <svg id="chart" viewBox="0 0 640 210" preserveAspectRatio="none"></svg>
          <div class="tip" id="tip"></div>
        </div>
      </div>

      <div class="panel">
        <div class="cap" style="margin-bottom:14px;">Traffic sources</div>
        <div class="donut-wrap">
          <svg width="120" height="120" viewBox="0 0 42 42" id="donut"></svg>
          <div class="legend" id="legend"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="cap" style="margin-bottom:14px;">Top products</div>
      <table>
        <thead><tr><th>Product</th><th>Revenue</th><th style="width:34%">Share</th><th>Trend</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

<script>
(function(){
  // deterministic pseudo-random so the demo looks alive but stable
  var seed = 42; function rnd(){ seed = (seed*1103515245+12345) & 0x7fffffff; return seed/0x7fffffff; }
  function series(n, base, vol){ var a=[], v=base; for(var i=0;i<n;i++){ v += (rnd()-0.45)*vol; v=Math.max(base*0.5, v); a.push(v); } return a; }

  var DATA = {
    7:   { mrr: series(7,  48000, 2600), label:'7 days'  },
    30:  { mrr: series(30, 44000, 2200), label:'30 days' },
    90:  { mrr: series(90, 36000, 1800), label:'90 days' },
    365: { mrr: series(52, 22000, 2600), label:'12 months' }
  };
  var fmt = function(n){ return '$'+Math.round(n).toLocaleString('en-US'); };
  var fmtK = function(n){ return '$'+(n/1000).toFixed(1)+'k'; };

  // ---- KPI cards ----
  var kpis = [
    { lbl:'MRR',           val:function(d){return fmt(d.mrr[d.mrr.length-1]);}, delta:'+12.4%', up:true,  spark:'a' },
    { lbl:'Active users',  val:function(){return '8,214';}, delta:'+4.1%', up:true,  spark:'b' },
    { lbl:'Churn rate',    val:function(){return '2.3%';},  delta:'-0.4%', up:true,  spark:'c' },
    { lbl:'ARPU',          val:function(){return '$28.60';},delta:'-1.2%', up:false, spark:'d' }
  ];
  function sparkPath(key){
    var pts = series(14, 20, 8), max=Math.max.apply(null,pts), min=Math.min.apply(null,pts);
    return pts.map(function(v,i){ var x=i/(pts.length-1)*62+1; var y=24-((v-min)/(max-min||1))*22; return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); }).join(' ');
  }
  function renderKpis(d){
    document.getElementById('kpis').innerHTML = kpis.map(function(k){
      return '<div class="kpi"><div class="lbl">'+k.lbl+'</div><div class="val tnum">'+k.val(d)+'</div>'+
        '<div class="row"><span class="delta '+(k.up?'up':'dn')+'">'+k.delta+'</span>'+
        '<svg class="spark" viewBox="0 0 64 26"><path d="'+sparkPath(k.spark)+'" fill="none" stroke="'+(k.up?'oklch(0.74 0.16 155)':'oklch(0.68 0.19 22)')+'" stroke-width="2" stroke-linecap="round"/></svg></div></div>';
    }).join('');
  }

  // ---- main area chart ----
  var chart = document.getElementById('chart'), tip = document.getElementById('tip'), W=640, H=210, PAD=8;
  var current = [];
  function renderChart(arr){
    current = arr;
    var max=Math.max.apply(null,arr), min=Math.min.apply(null,arr), span=max-min||1;
    var xs = function(i){ return i/(arr.length-1)*(W-PAD*2)+PAD; };
    var ys = function(v){ return H-PAD - ((v-min)/span)*(H-PAD*2); };
    var line='', area='';
    arr.forEach(function(v,i){ var x=xs(i).toFixed(1), y=ys(v).toFixed(1); line+=(i?'L':'M')+x+' '+y+' '; });
    area = line + 'L'+xs(arr.length-1).toFixed(1)+' '+H+' L'+xs(0).toFixed(1)+' '+H+' Z';
    var grid=''; for(var g=0;g<4;g++){ var gy=(PAD+g*(H-PAD*2)/3).toFixed(1); grid+='<line x1="0" x2="'+W+'" y1="'+gy+'" y2="'+gy+'" stroke="oklch(0.31 0.03 275)" stroke-width="1" stroke-dasharray="2 5"/>'; }
    chart.innerHTML =
      '<defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1">'+
      '<stop offset="0" stop-color="oklch(0.72 0.15 285)" stop-opacity="0.35"/>'+
      '<stop offset="1" stop-color="oklch(0.72 0.15 285)" stop-opacity="0"/></linearGradient></defs>'+
      grid+
      '<path d="'+area+'" fill="url(#fill)"/>'+
      '<path id="ln" d="'+line+'" fill="none" stroke="oklch(0.75 0.15 285)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<circle id="cur" r="4" fill="oklch(0.85 0.1 285)" stroke="oklch(0.205 0.026 275)" stroke-width="2" opacity="0"/>';
    var ln = document.getElementById('ln'), len = ln.getTotalLength();
    ln.style.strokeDasharray = len; ln.style.strokeDashoffset = len;
    ln.getBoundingClientRect(); ln.style.transition='stroke-dashoffset 1s cubic-bezier(.16,1,.3,1)'; ln.style.strokeDashoffset='0';
    document.getElementById('mrrBig').textContent = fmt(arr[arr.length-1]);
  }
  chart.addEventListener('mousemove', function(e){
    if(!current.length) return;
    var r=chart.getBoundingClientRect(), rel=(e.clientX-r.left)/r.width;
    var idx=Math.round(rel*(current.length-1)); idx=Math.max(0,Math.min(current.length-1,idx));
    var max=Math.max.apply(null,current), min=Math.min.apply(null,current), span=max-min||1;
    var x=(idx/(current.length-1))*(W-PAD*2)+PAD, y=H-PAD-((current[idx]-min)/span)*(H-PAD*2);
    var cur=document.getElementById('cur'); if(cur){ cur.setAttribute('cx',x); cur.setAttribute('cy',y); cur.setAttribute('opacity','1'); }
    tip.style.left=(x/W*r.width)+'px'; tip.style.top=(y/H*r.height)+'px'; tip.style.opacity='1';
    tip.innerHTML='<b>'+fmtK(current[idx])+'</b>';
  });
  chart.addEventListener('mouseleave', function(){ tip.style.opacity='0'; var c=document.getElementById('cur'); if(c)c.setAttribute('opacity','0'); });

  // ---- donut ----
  var sources=[ {n:'Organic',v:42,c:'oklch(0.72 0.15 285)'}, {n:'Referral',v:26,c:'oklch(0.80 0.12 205)'}, {n:'Direct',v:20,c:'oklch(0.74 0.16 155)'}, {n:'Social',v:12,c:'oklch(0.78 0.13 60)'} ];
  (function(){
    var off=0, d=document.getElementById('donut'), s='';
    sources.forEach(function(x){
      s+='<circle cx="21" cy="21" r="15.9" fill="none" stroke="'+x.c+'" stroke-width="5" stroke-dasharray="'+x.v+' '+(100-x.v)+'" stroke-dashoffset="'+(25-off)+'"/>';
      off+=x.v;
    });
    s+='<text x="21" y="21" text-anchor="middle" dominant-baseline="central" fill="oklch(0.97 0.008 275)" font-size="7" font-weight="700">100%</text>';
    d.innerHTML=s;
    document.getElementById('legend').innerHTML = sources.map(function(x){ return '<div class="lg"><span class="dot" style="background:'+x.c+'"></span>'+x.n+'<b>'+x.v+'%</b></div>'; }).join('');
  })();

  // ---- top products table ----
  var prods=[ {n:'Pro plan',ic:'P',c:'oklch(0.72 0.15 285)',r:18420,s:100}, {n:'Team seats',ic:'T',c:'oklch(0.80 0.12 205)',r:12960,s:70}, {n:'Add-ons',ic:'A',c:'oklch(0.74 0.16 155)',r:6240,s:34}, {n:'API credits',ic:'C',c:'oklch(0.78 0.13 60)',r:3110,s:17} ];
  document.getElementById('rows').innerHTML = prods.map(function(p,i){
    var up=i!==3;
    return '<tr><td><div class="prod"><span class="ic" style="background:'+p.c+'">'+p.ic+'</span>'+p.n+'</div></td>'+
      '<td class="tnum">'+fmt(p.r)+'</td>'+
      '<td><div class="mbar"><i style="width:'+p.s+'%"></i></div></td>'+
      '<td><span class="delta '+(up?'up':'dn')+'">'+(up?'▲':'▼')+' '+(3+i)+'.'+i+'%</span></td></tr>';
  }).join('');

  // ---- range toggle ----
  document.getElementById('seg').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#seg button').forEach(function(x){x.classList.remove('on')}); b.classList.add('on');
    var d=DATA[b.dataset.r]; renderKpis(d); renderChart(d.mrr);
  });

  // ---- live active-now ticker ----
  var an=document.getElementById('activeNow'), base=1240;
  function tick(){ base += Math.round((rnd()-0.5)*24); an.textContent = base.toLocaleString('en-US'); }
  tick(); setInterval(tick, 2200);

  // init
  renderKpis(DATA[30]); renderChart(DATA[30].mrr);
})();
</script>
</body>
</html>
